server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    client_max_body_size 100M;

     location /api {
        auth_gss on;
        auth_gss_realm SGP.RU;
        auth_gss_keytab /etc/example.keytab;
        auth_gss_service_name HTTP/test-vapp-03.sgp.ru;

        #proxy_pass http://test-vapp-03.sgp.ru:8004;
        #proxy_pass http://table_service-app-1:8000;
        proxy_pass http://table_service_api-app-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User $remote_user;
        proxy_connect_timeout 600s;
        send_timeout 600s;
    }

    location /table_service {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    error_log /var/log/nginx/table_service_error_log.log;
    access_log /var/log/nginx/table_service_access_log.log;
}